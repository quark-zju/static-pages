<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Annualized Price Timeline</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&display=swap");

    :root {
      --gh-bg: #f6f8fa;
      --gh-surface: #ffffff;
      --gh-border: #d0d7de;
      --gh-text: #24292f;
      --gh-muted: #57606a;
      --gh-blue: #0969da;
      --gh-shadow: 0 10px 30px rgba(31, 35, 40, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "IBM Plex Sans", "Noto Sans SC", sans-serif;
      color: var(--gh-text);
      background:
        radial-gradient(circle at 0% 0%, rgba(9,105,218,0.08) 0%, rgba(9,105,218,0) 45%),
        radial-gradient(circle at 100% 100%, rgba(45,164,78,0.08) 0%, rgba(45,164,78,0) 40%),
        var(--gh-bg);
      display: grid; place-items: start center; padding: 24px;
    }
    .page {
      width: min(1200px, 100%);
      background: var(--gh-surface);
      border: 1px solid var(--gh-border); border-radius: 14px;
      box-shadow: var(--gh-shadow); overflow: hidden;
    }
    .topbar {
      height: 52px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; border-bottom: 1px solid var(--gh-border);
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    }
    .topbar-dots { display: flex; gap: 8px; }
    .dot {
      width: 10px; height: 10px; border-radius: 999px;
      border: 1px solid rgba(31,35,40,0.2); background: #f0f3f6;
    }
    .topbar-updated { font-size: 12px; color: var(--gh-muted); }
    .content { padding: 24px 28px; }
    h1 { margin: 0; font-size: 22px; font-weight: 700; }
    .subtitle { margin: 6px 0 14px; color: var(--gh-muted); font-size: 13px; }

    .controls-row {
      display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px;
      margin-bottom: 12px;
    }
    .toggle-label {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--gh-text); cursor: pointer; user-select: none;
    }
    .toggle-label input { cursor: pointer; }

    .model-legend {
      display: flex; flex-wrap: wrap; gap: 6px 16px;
    }
    .legend-entry {
      display: flex; align-items: center; gap: 5px;
      font-size: 12px; cursor: pointer; user-select: none;
      padding: 2px 8px; border-radius: 6px;
      border: 1px solid transparent; transition: all 120ms;
      opacity: 0.5;
    }
    .legend-entry.on { opacity: 1; border-color: var(--gh-border); background: #f6f8fa; }
    .legend-entry:hover { opacity: 0.8; }
    .legend-swatch {
      width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0;
    }
    .extrap-note {
      font-size: 11px; color: var(--gh-muted); margin-top: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .extrap-note span {
      display: inline-block; width: 12px; height: 12px; border-radius: 3px;
      background: repeating-linear-gradient(45deg, transparent, transparent 2px, #d0d7de 2px, #d0d7de 3px);
    }

    .chart-svg-wrap { width: 100%; margin-top: 8px; }
    .chart-svg-wrap svg { width: 100%; height: auto; display: block; }
    .chart-svg-wrap text { font-family: inherit; }
    .no-data { text-align: center; padding: 48px; color: var(--gh-muted); }

    @media (max-width: 640px) { .content { padding: 18px 12px; } }
  </style>
</head>
<body>
<main class="page">
  <header class="topbar" aria-hidden="true">
    <div class="topbar-dots">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <span class="topbar-updated" id="updated"></span>
  </header>

  <section class="content">
    <h1>Pixel 年度化价格时间线</h1>
    <p class="subtitle">
      年化价格 = 某时刻价格 &times; 365.25 &div; max(当时距 EOL 天数, 365.25)（年化 $/yr）。<br>
      起始 = 最早有价格数据的日期；结束 = 所有型号 EOL 的最晚日期。
      灰色斜纹区段为无实际价格记录的推算区间。
    </p>

    <div class="controls-row" id="controlsRow">
      <label class="toggle-label">
        <input type="checkbox" id="showPrice">
        同时显示总价（虚线，右轴 $）
      </label>
    </div>

    <div class="model-legend" id="modelLegend"></div>
    <div class="chart-svg-wrap" id="chartWrap"></div>
  </section>
</main>

<script>
(function() {
  const LEGEND = document.getElementById("modelLegend");
  const CHART_WRAP = document.getElementById("chartWrap");
  const UPDATED_EL = document.getElementById("updated");
  const SHOW_PRICE_CB = document.getElementById("showPrice");

  const COLORS = [
    "#0969da","#cf222e","#2da44e","#bf8700","#8250df",
    "#d63384","#0550ae","#1a7f37","#9a6700","#6e7781"
  ];

  let data = null;
  let modelColors = {};
  let visible = {};

  // ---- Init ---- //

  async function init() {
    try {
      const resp = await fetch("data.json");
      data = await resp.json();
      UPDATED_EL.textContent = "更新: " + data.updated.slice(0, 10);

      const priceModels = data.models.filter(m => m.hasPriceData && m.priceHistory.length > 0);
      priceModels.forEach((m, i) => {
        modelColors[m.slug] = i % COLORS.length;
        visible[m.slug] = true;
      });

      renderLegend(priceModels);
      drawChart();

      SHOW_PRICE_CB.addEventListener("change", drawChart);
    } catch (e) {
      CHART_WRAP.innerHTML = '<div class="no-data">加载失败: ' + e.message + "</div>";
    }
  }

  // ---- Legend ---- //

  function renderLegend(priceModels) {
    let html = "";
    priceModels.forEach(m => {
      html += '<div class="legend-entry on" data-slug="' + m.slug + '">' +
        '<span class="legend-swatch" style="background:' + COLORS[modelColors[m.slug]] + '"></span>' +
        m.label + '</div>';
    });
    LEGEND.innerHTML = html;

    LEGEND.querySelectorAll(".legend-entry").forEach(el => {
      el.addEventListener("click", function() {
        const slug = this.dataset.slug;
        visible[slug] = !visible[slug];
        el.classList.toggle("on", visible[slug]);
        drawChart();
      });
    });
  }

  // ---- Build rendered history with synthetic endpoints ---- //

  function buildRenderedHistory(model) {
    const eol = new Date(model.eol);
    const release = new Date(model.releaseDate);
    const hist = model.priceHistory;
    if (hist.length === 0) return [];

    const points = [];

    const msDay = 86400000;
    const minDays = 365.25;
    const firstDataDate = new Date(hist[0].date);
    const lastDataDate = new Date(hist[hist.length - 1].date);

    function annualizedAt(price, whenDate) {
      const rawDays = (eol - whenDate) / msDay;
      const daysToEol = Math.max(minDays, rawDays);
      return Math.round(price * 365.25 / daysToEol * 100) / 100;
    }

    // Synthetic point at release date (use first known price)
    if (release < firstDataDate) {
      points.push({
        date: model.releaseDate,
        price: hist[0].price,
        annualizedPrice: annualizedAt(hist[0].price, release),
        synth: true
      });
    }

    // Actual data points
    hist.forEach(h => {
      const d = new Date(h.date);
      points.push({
        date: h.date,
        price: h.price,
        annualizedPrice: annualizedAt(h.price, d),
        synth: false
      });
    });

    // Synthetic point(s) extending to EOL using current price
    const crntPrice = model.crntPrice || hist[hist.length - 1].price;
    if (eol > lastDataDate) {
      // Compute annualized at a few steps to show the curve
      const steps = 3;
      for (let s = 1; s <= steps; s++) {
        const frac = s / steps;
        const ms = lastDataDate.getTime() + (eol.getTime() - lastDataDate.getTime()) * frac;
        const d = new Date(ms);
        points.push({
          date: d.toISOString().slice(0, 10),
          price: crntPrice,
          annualizedPrice: annualizedAt(crntPrice, d),
          synth: true
        });
      }
    }

    // Sort by date
    points.sort((a, b) => a.date.localeCompare(b.date));
    return points;
  }

  // ---- Chart ---- //

  function drawChart() {
    const showPrice = SHOW_PRICE_CB.checked;
    const priceModels = data.models.filter(m =>
      m.hasPriceData && m.priceHistory.length > 0 && visible[m.slug]
    );
    if (priceModels.length === 0) {
      CHART_WRAP.innerHTML = '<div class="no-data">未选中任何型号</div>';
      return;
    }

    // Build rendered histories
    const rendered = {};
    priceModels.forEach(m => {
      rendered[m.slug] = buildRenderedHistory(m);
    });

    // Compute global ranges
    let allDates = [];
    let allActualDates = [];
    let allAnnual = [];
    let allPrices = [];

    priceModels.forEach(m => {
      rendered[m.slug].forEach(h => {
        const d = new Date(h.date);
        allDates.push(d);
        if (!h.synth) allActualDates.push(d);
        allAnnual.push(h.annualizedPrice);
        allPrices.push(h.price);
      });
    });

    // X-axis: start from earliest data point, end at latest eol
    const eolDates = priceModels.map(m => new Date(m.eol));
    const minDate = new Date(Math.min(...allActualDates));
    const maxDate = new Date(Math.max(...eolDates));
    const tRangeMs = maxDate - minDate || 1;

    const annualLo = Math.floor(Math.min(...allAnnual) * 0.92 / 10) * 10;
    const annualHi = Math.ceil(Math.max(...allAnnual) * 1.08 / 10) * 10;
    const priceLo = Math.floor(Math.min(...allPrices) * 0.92 / 50) * 50;
    const priceHi = Math.ceil(Math.max(...allPrices) * 1.08 / 50) * 50;

    const W = 1200;
    const H = 520;
    const pad = { top: 36, right: showPrice ? 80 : 50, bottom: 56, left: 70 };
    const pw = W - pad.left - pad.right;
    const ph = H - pad.top - pad.bottom;

    function x(d) { return pad.left + (d - minDate) / tRangeMs * pw; }
    function yAnnual(v) {
      if (annualHi === annualLo) return pad.top + ph / 2;
      return pad.top + ph - (v - annualLo) / (annualHi - annualLo) * ph;
    }
    function yPrice(v) {
      if (priceHi === priceLo) return pad.top + ph / 2;
      return pad.top + ph - (v - priceLo) / (priceHi - priceLo) * ph;
    }

    let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
    svg += '<rect width="' + W + '" height="' + H + '" fill="#fff"/>';

    // Grid lines (annualized scale)
    const gridLines = 6;
    for (let i = 0; i <= gridLines; i++) {
      const gy = pad.top + ph * i / gridLines;
      svg += '<line x1="' + pad.left + '" y1="' + gy + '" x2="' + (W - pad.right) + '" y2="' + gy + '" stroke="#eaeef2" stroke-dasharray="3,5"/>';
    }

    // Y-axis left (annualized)
    svg += '<g font-size="11" fill="#57606a">';
    for (let i = 0; i <= gridLines; i++) {
      const v = annualHi - (annualHi - annualLo) * i / gridLines;
      const gy = pad.top + ph * i / gridLines;
      svg += '<text x="' + (pad.left - 8) + '" y="' + (gy + 4) + '" text-anchor="end">$' + Math.round(v) + '</text>';
    }
    svg += '<text x="' + (pad.left - 8) + '" y="' + (pad.top - 12) + '" text-anchor="end" font-size="11" font-weight="600" fill="#24292f">年化 $/yr</text>';
    svg += '</g>';

    // Y-axis right (price) — only if shown
    if (showPrice) {
      svg += '<g font-size="11" fill="#57606a">';
      for (let i = 0; i <= gridLines; i++) {
        const v = priceHi - (priceHi - priceLo) * i / gridLines;
        const gy = pad.top + ph * i / gridLines;
        svg += '<text x="' + (W - pad.right + 8) + '" y="' + (gy + 4) + '" text-anchor="start">$' + Math.round(v) + '</text>';
      }
      svg += '<text x="' + (W - pad.right + 8) + '" y="' + (pad.top - 12) + '" text-anchor="start" font-size="11" font-weight="600" fill="#24292f">总价 $</text>';
      svg += '</g>';
    }

    // X-axis
    svg += '<g font-size="11" fill="#57606a">';
    svg += '<line x1="' + pad.left + '" y1="' + (pad.top + ph) + '" x2="' + (W - pad.right) + '" y2="' + (pad.top + ph) + '" stroke="#d0d7de"/>';
    const xTicks = 10;
    for (let i = 0; i <= xTicks; i++) {
      const ms = minDate.getTime() + tRangeMs * i / xTicks;
      const dt = new Date(ms);
      const tx = pad.left + pw * i / xTicks;
      const mo = dt.getMonth() + 1;
      svg += '<text x="' + tx + '" y="' + (H - 16) + '" text-anchor="middle">' + dt.getFullYear() + "/" + (mo < 10 ? "0" : "") + mo + '</text>';
    }
    svg += '</g>';

    // Now line
    const now = new Date();
    if (now >= minDate && now <= maxDate) {
      const nx = x(now);
      svg += '<line x1="' + nx + '" y1="' + pad.top + '" x2="' + nx + '" y2="' + (pad.top + ph) + '" stroke="#0969da" stroke-width="2" stroke-dasharray="8,6" opacity="0.55"/>';
      svg += '<text x="' + nx + '" y="' + (pad.top - 6) + '" text-anchor="middle" font-size="10" fill="#0969da" font-weight="600">Now</text>';
    }

    // Helper to draw a path segment (handles synth vs real style)
    function drawModel(m, points) {
      const cIdx = modelColors[m.slug];
      const c = COLORS[cIdx];

      // Split into segments: real (solid) and synth (dotted/dashed)
      const realSegs = [];
      const synthSegs = [];
      let curReal = []; let curSynth = [];

      points.forEach((pt, i) => {
        if (pt.synth) {
          if (curReal.length) {
            // Transition from real to synth: include the bridge point
            if (curReal.length) curReal.push(pt);
            realSegs.push([...curReal]);
            curReal = [];
          }
          curSynth.push(pt);
        } else {
          if (curSynth.length) {
            if (curSynth.length) curSynth.push(pt);
            synthSegs.push([...curSynth]);
            curSynth = [];
          }
          curReal.push(pt);
        }
      });
      if (curReal.length >= 1) realSegs.push([...curReal]);
      if (curSynth.length >= 1) synthSegs.push([...curSynth]);

      function polyline(segs, yFunc) {
        let d = "";
        segs.forEach(seg => {
          if (seg.length < 2) return;
          seg.forEach((pt, i) => {
            const cx = x(new Date(pt.date));
            const cy = yFunc(pt.price !== undefined ? pt.price : pt.annualizedPrice);
            d += (i === 0 ? "M" : "L") + cx.toFixed(1) + "," + cy.toFixed(1);
          });
        });
        return d;
      }

      function synPolyline(segs, yFunc) {
        let d = "";
        segs.forEach(seg => {
          // Include single points as zero-length dashes (just dots)
          seg.forEach((pt, i) => {
            const cx = x(new Date(pt.date));
            const cy = yFunc(pt.price !== undefined ? pt.price : pt.annualizedPrice);
            d += (i === 0 ? "M" : "L") + cx.toFixed(1) + "," + cy.toFixed(1);
          });
        });
        return d;
      }

      // Annualized line (always shown)
      const aRealD = polyline(realSegs, pt => yAnnual(pt.annualizedPrice));
      const aSynD = synPolyline(synthSegs, pt => yAnnual(pt.annualizedPrice));

      if (aRealD) {
        svg += '<path d="' + aRealD + '" fill="none" stroke="' + c + '" stroke-width="2.2" opacity="0.85" vector-effect="non-scaling-stroke"/>';
      }
      if (aSynD) {
        svg += '<path d="' + aSynD + '" fill="none" stroke="#a0a8b0" stroke-width="2" stroke-dasharray="4,6" opacity="0.45" vector-effect="non-scaling-stroke"/>';
      }

      // Dots for annualized data points (real only)
      points.forEach(pt => {
        if (pt.synth) return;
        const cx = x(new Date(pt.date));
        const cy = yAnnual(pt.annualizedPrice);
        svg += '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="2.5" fill="' + c + '"/>';
      });

      // Price line (only if checkbox enabled)
      if (showPrice) {
        const pRealD = polyline(realSegs, pt => yPrice(pt.price));
        const pSynD = synPolyline(synthSegs, pt => yPrice(pt.price));
        if (pRealD) {
          svg += '<path d="' + pRealD + '" fill="none" stroke="' + c + '" stroke-width="1.5" stroke-dasharray="8,5" opacity="0.6" vector-effect="non-scaling-stroke"/>';
        }
        if (pSynD) {
          svg += '<path d="' + pSynD + '" fill="none" stroke="#a0a8b0" stroke-width="1.2" stroke-dasharray="3,7" opacity="0.25" vector-effect="non-scaling-stroke"/>';
        }
        points.forEach(pt => {
          if (pt.synth) return;
          const cx = x(new Date(pt.date));
          const cy = yPrice(pt.price);
          svg += '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="1.8" fill="' + c + '" opacity="0.5"/>';
        });
      }
    }

    priceModels.forEach(m => {
      drawModel(m, rendered[m.slug]);
    });

    // EOL markers for visible models
    priceModels.forEach(m => {
      const c = COLORS[modelColors[m.slug]];
      const eolDate = new Date(m.eol);
      if (eolDate >= minDate && eolDate <= maxDate) {
        const ex = x(eolDate);
        svg += '<line x1="' + ex + '" y1="' + pad.top + '" x2="' + ex + '" y2="' + (pad.top + ph) + '" stroke="' + c + '" stroke-width="1" stroke-dasharray="2,5" opacity="0.3"/>';
        svg += '<text x="' + ex + '" y="' + (pad.top + ph + 14) + '" text-anchor="middle" font-size="8" fill="' + c + '" opacity="0.7">' + m.label + ' EOL</text>';
      }
    });

    svg += '</svg>';
    CHART_WRAP.innerHTML = svg;
  }

  init();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Annualized Price Timeline</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&display=swap");

    :root {
      --gh-bg: #f6f8fa;
      --gh-surface: #ffffff;
      --gh-border: #d0d7de;
      --gh-text: #24292f;
      --gh-muted: #57606a;
      --gh-blue: #0969da;
      --gh-shadow: 0 10px 30px rgba(31, 35, 40, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", "Noto Sans SC", sans-serif;
      color: var(--gh-text);
      background:
        radial-gradient(circle at 0% 0%, rgba(9, 105, 218, 0.08) 0%, rgba(9, 105, 218, 0) 45%),
        radial-gradient(circle at 100% 100%, rgba(45, 164, 78, 0.08) 0%, rgba(45, 164, 78, 0) 40%),
        var(--gh-bg);
      display: grid;
      place-items: start center;
      padding: 24px;
    }

    .page {
      width: min(1200px, 100%);
      background: var(--gh-surface);
      border: 1px solid var(--gh-border);
      border-radius: 14px;
      box-shadow: var(--gh-shadow);
      overflow: hidden;
    }

    .topbar {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--gh-border);
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    }
    .topbar-dots { display: flex; gap: 8px; }
    .dot {
      width: 10px; height: 10px; border-radius: 999px;
      border: 1px solid rgba(31, 35, 40, 0.2); background: #f0f3f6;
    }
    .topbar-updated { font-size: 12px; color: var(--gh-muted); }

    .content { padding: 24px 28px; }

    .header-row {
      display: flex; justify-content: space-between; align-items: flex-start;
      flex-wrap: wrap; gap: 16px; margin-bottom: 4px;
    }
    h1 { margin: 0; font-size: 22px; font-weight: 700; }

    /* ---- Gantt timeline ---- */
    .timeline-wrap { overflow-x: auto; overflow-y: visible; -webkit-overflow-scrolling: touch; margin-bottom: 28px; }
    .timeline { --row-h: 38px; display: grid; grid-template-columns: 200px 1fr; min-width: 700px; }

    .tl-labels, .tl-bars { display: flex; flex-direction: column; }
    .tl-label {
      height: var(--row-h); display: flex; align-items: center;
      padding: 0 12px; font-size: 13px; font-weight: 600;
      border-bottom: 1px solid #f0f0f0; cursor: pointer;
      user-select: none; white-space: nowrap; transition: background 120ms;
    }
    .tl-label:hover { background: #f6f8fa; }
    .tl-bar-row {
      height: var(--row-h); display: flex; align-items: center;
      position: relative; border-bottom: 1px solid #f0f0f0;
    }
    .tl-bar-row:nth-child(even) { background: #fafbfc; }
    .tl-bar {
      position: absolute; top: 50%; transform: translateY(-50%);
      height: 20px; border-radius: 4px; display: flex; align-items: center;
      padding: 0 8px; font-size: 11px; font-weight: 600; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      cursor: pointer; transition: filter 120ms, box-shadow 120ms;
    }
    .tl-bar:hover { filter: brightness(0.92); box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
    .tl-now-line {
      position: absolute; top: 0; bottom: 0; width: 1px;
      background: var(--gh-blue); opacity: 0.35; z-index: 2; pointer-events: none;
    }

    /* ---- Overlaid chart ---- */
    .chart-section { border-top: 1px solid var(--gh-border); padding-top: 20px; }
    .chart-section h2 { margin: 0 0 4px; font-size: 16px; }
    .chart-subtitle { margin: 0 0 12px; font-size: 12px; color: var(--gh-muted); }
    .chart-svg-wrap { position: relative; width: 100%; }
    .chart-svg-wrap svg { width: 100%; height: auto; display: block; }
    .chart-svg-wrap text { font-family: inherit; }

    /* ---- Legend ---- */
    .model-legend {
      display: flex; flex-wrap: wrap; gap: 10px 20px; margin-bottom: 12px;
    }
    .legend-entry {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; cursor: pointer; user-select: none;
      padding: 3px 8px; border-radius: 6px;
      border: 1px solid transparent; transition: all 120ms;
      opacity: 0.55;
    }
    .legend-entry.on { opacity: 1; border-color: var(--gh-border); background: #f6f8fa; }
    .legend-entry:hover { opacity: 0.85; }
    .legend-swatch { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
    .legend-dash {
      width: 14px; height: 0; border-top: 2px dashed; flex-shrink: 0;
      margin-left: -4px; margin-right: 2px;
    }

    .no-data { text-align: center; padding: 32px; color: var(--gh-muted); }

    @media (max-width: 640px) {
      .content { padding: 18px 12px; }
      .timeline { --row-h: 34px; }
    }
  </style>
</head>
<body>
<main class="page">
  <header class="topbar" aria-hidden="true">
    <div class="topbar-dots">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <span class="topbar-updated" id="updated"></span>
  </header>

  <section class="content">
    <div class="header-row">
      <h1>Pixel 年度化价格时间线</h1>
    </div>
    <p style="margin:4px 0 16px;color:var(--gh-muted);font-size:13px;">
      年化价格 = 某时刻价格 &times; 365.25 &div; 当时距 EOL 天数。点击型号切换图表显示。
    </p>

    <div class="timeline-wrap">
      <div class="timeline" id="timeline"></div>
    </div>

    <div class="chart-section" id="chartSection">
      <h2>价格 &amp; 年化走势（多型号覆盖）</h2>
      <p class="chart-subtitle">实线 = 价格（左轴 $），虚线 = 年化价格（右轴 $/yr）。点击图例切换。</p>
      <div class="model-legend" id="modelLegend"></div>
      <div class="chart-svg-wrap" id="chartWrap"></div>
    </div>
  </section>
</main>

<script>
(function() {
  const TIMELINE = document.getElementById("timeline");
  const LEGEND = document.getElementById("modelLegend");
  const CHART_WRAP = document.getElementById("chartWrap");
  const UPDATED_EL = document.getElementById("updated");

  // Color palette for models
  const COLORS = [
    "#0969da", "#cf222e", "#2da44e", "#bf8700", "#8250df",
    "#d63384", "#0550ae", "#1a7f37", "#9a6700", "#6e7781"
  ];

  let data = null;
  let modelColors = {};  // slug -> color index
  let visible = {};      // slug -> boolean

  async function init() {
    try {
      const resp = await fetch("data.json");
      data = await resp.json();
      UPDATED_EL.textContent = "更新: " + data.updated.slice(0, 10);

      // Assign colors to models with price data
      const priceModels = data.models.filter(m => m.hasPriceData && m.priceHistory.length > 0);
      priceModels.forEach((m, i) => {
        modelColors[m.slug] = i % COLORS.length;
        visible[m.slug] = true;
      });

      renderTimeline(data.models);
      renderLegend(priceModels);
      renderOverlayChart(priceModels);
    } catch (e) {
      TIMELINE.innerHTML = '<div class="no-data">加载数据失败: ' + e.message + "</div>";
    }
  }

  // ---- Gantt timeline ---- //

  function eolStatus(model) {
    if (!model.eol) return "past";
    const today = new Date();
    const eol = new Date(model.eol);
    const months = (eol - today) / (1000 * 60 * 60 * 24 * 30);
    if (eol < today) return "past";
    if (months < 12) return "near";
    return "support";
  }

  function renderTimeline(models) {
    const today = new Date();
    const allDates = models.flatMap(m => [new Date(m.releaseDate), new Date(m.eol)]);
    const minDate = new Date(Math.min(...allDates));
    const maxDate = new Date(Math.max(...allDates, today));
    const totalMs = maxDate - minDate;

    function pct(dstr) { return ((new Date(dstr) - minDate) / totalMs * 100).toFixed(4); }
    const nowPct = ((today - minDate) / totalMs * 100).toFixed(4);

    let html = '<div class="tl-labels">';
    let barHtml = '<div class="tl-bars">';

    for (let i = 0; i < models.length; i++) {
      const m = models[i];
      const status = eolStatus(m);
      const leftPct = pct(m.releaseDate);
      const widthPct = Math.max(1, parseFloat(pct(m.eol)) - parseFloat(leftPct));
      const color = modelColors.hasOwnProperty(m.slug)
        ? COLORS[modelColors[m.slug]]
        : (status === "support" ? "#2da44e" : status === "near" ? "#bf8700" : "#cf222e33");

      const bg = modelColors.hasOwnProperty(m.slug) ? color
        : (status === "support" ? "#2da44e" : status === "near" ? "#bf8700" : "#f0f3f6");

      const textColor = modelColors.hasOwnProperty(m.slug) ? "#fff" : (status === "past" ? "#57606a" : "#fff");
      const borderStyle = status === "past" && !modelColors.hasOwnProperty(m.slug) ? "border:1px dashed var(--gh-border)" : "";

      const annualLabel = m.hasPriceData
        ? "$" + m.crntAnnualizedPrice + "/yr"
        : "无价格";

      html += '<div class="tl-label" data-slug="' + m.slug + '">' + m.label + '</div>';

      barHtml += '<div class="tl-bar-row">';
      barHtml += '<div class="tl-bar" data-slug="' + m.slug + '"' +
        ' style="left:' + leftPct + '%;width:' + widthPct + '%;background:' + bg + ';color:' + textColor + ';' + borderStyle + '">' +
        annualLabel + '</div>';
      barHtml += '</div>';
    }

    html += '</div>' + barHtml + '</div>';
    TIMELINE.innerHTML = html;

    const lastRow = TIMELINE.querySelector(".tl-bars .tl-bar-row:last-child");
    if (lastRow) {
      const line = document.createElement("div");
      line.className = "tl-now-line";
      line.style.left = nowPct + "%";
      lastRow.appendChild(line);
    }

    // Click to toggle visibility
    TIMELINE.querySelectorAll(".tl-bar, .tl-label").forEach(el => {
      el.addEventListener("click", function() {
        const slug = this.dataset.slug;
        if (!modelColors.hasOwnProperty(slug)) return;
        visible[slug] = !visible[slug];
        updateLegendUI();
        drawChart();
      });
    });
  }

  // ---- Legend ---- //

  function renderLegend(priceModels) {
    let html = "";
    priceModels.forEach(m => {
      const c = COLORS[modelColors[m.slug]];
      html += '<div class="legend-entry on" data-slug="' + m.slug + '">' +
        '<span class="legend-swatch" style="background:' + c + '"></span>' +
        '<span class="legend-dash" style="border-color:' + c + '"></span>' +
        m.label + '</div>';
    });
    LEGEND.innerHTML = html;

    LEGEND.querySelectorAll(".legend-entry").forEach(el => {
      el.addEventListener("click", function() {
        const slug = this.dataset.slug;
        visible[slug] = !visible[slug];
        updateLegendUI();
        drawChart();
      });
    });
  }

  function updateLegendUI() {
    LEGEND.querySelectorAll(".legend-entry").forEach(el => {
      const slug = el.dataset.slug;
      el.classList.toggle("on", visible[slug]);
    });
  }

  // ---- Overlaid chart ---- //

  function renderOverlayChart(priceModels) {
    if (priceModels.length === 0) {
      CHART_WRAP.innerHTML = '<div class="no-data">暂无价格数据</div>';
      return;
    }
    drawChart();
  }

  function drawChart() {
    const priceModels = data.models.filter(m =>
      m.hasPriceData && m.priceHistory.length > 0 && visible[m.slug]
    );
    if (priceModels.length === 0) {
      CHART_WRAP.innerHTML = '<div class="no-data">未选中任何型号</div>';
      return;
    }

    // Compute global ranges
    let allDates = [];
    let allPrices = [];
    let allAnnual = [];

    priceModels.forEach(m => {
      m.priceHistory.forEach(h => {
        const d = new Date(h.date);
        allDates.push(d);
        allPrices.push(h.price);
        allAnnual.push(h.annualizedPrice);
      });
    });

    const minDate = new Date(Math.min(...allDates));
    const maxDate = new Date(Math.max(...allDates));
    const tRange = maxDate - minDate || 1;

    const priceLo = Math.floor(Math.min(...allPrices) * 0.92 / 50) * 50;
    const priceHi = Math.ceil(Math.max(...allPrices) * 1.08 / 50) * 50;
    const annualLo = Math.floor(Math.min(...allAnnual) * 0.92 / 10) * 10;
    const annualHi = Math.ceil(Math.max(...allAnnual) * 1.08 / 10) * 10;

    const W = 1100;
    const H = 480;
    const pad = { top: 30, right: 70, bottom: 50, left: 70 };
    const pw = W - pad.left - pad.right;
    const ph = H - pad.top - pad.bottom;

    function x(d) { return pad.left + (d - minDate) / tRange * pw; }

    function yPrice(v) {
      if (priceHi === priceLo) return pad.top + ph / 2;
      return pad.top + ph - (v - priceLo) / (priceHi - priceLo) * ph;
    }

    function yAnnual(v) {
      if (annualHi === annualLo) return pad.top + ph / 2;
      return pad.top + ph - (v - annualLo) / (annualHi - annualLo) * ph;
    }

    function polyline(points, yFunc) {
      if (points.length === 0) return "";
      let d = "";
      points.forEach((pt, i) => {
        const cx = x(new Date(pt.date));
        const cy = yFunc(pt.price !== undefined ? pt.price : pt.annualizedPrice);
        d += (i === 0 ? "M" : "L") + cx.toFixed(1) + "," + cy.toFixed(1);
      });
      return d;
    }

    // Also compute polyline for annualized
    function polylineAnnual(points) {
      if (points.length === 0) return "";
      let d = "";
      points.forEach((pt, i) => {
        const cx = x(new Date(pt.date));
        const cy = yAnnual(pt.annualizedPrice);
        d += (i === 0 ? "M" : "L") + cx.toFixed(1) + "," + cy.toFixed(1);
      });
      return d;
    }

    let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';

    // Background
    svg += '<rect width="' + W + '" height="' + H + '" fill="#fff"/>';

    // Horizontal grid lines (price scale)
    const gridLines = 6;
    for (let i = 0; i <= gridLines; i++) {
      const gy = pad.top + ph * i / gridLines;
      svg += '<line x1="' + pad.left + '" y1="' + gy + '" x2="' + (W - pad.right) + '" y2="' + gy + '" stroke="#eaeef2" stroke-dasharray="3,5"/>';
    }

    // Y-axis left (price)
    svg += '<g font-size="11" fill="' + 'var(--gh-muted)' + '">';
    for (let i = 0; i <= gridLines; i++) {
      const v = priceHi - (priceHi - priceLo) * i / gridLines;
      const gy = pad.top + ph * i / gridLines;
      svg += '<text x="' + (pad.left - 8) + '" y="' + (gy + 4) + '" text-anchor="end">$' + Math.round(v) + '</text>';
    }
    svg += '<text x="' + (pad.left - 8) + '" y="' + (pad.top - 10) + '" text-anchor="end" font-size="10" font-weight="600" fill="#24292f">价格</text>';
    svg += '</g>';

    // Y-axis right (annualized)
    svg += '<g font-size="11" fill="' + 'var(--gh-muted)' + '">';
    for (let i = 0; i <= gridLines; i++) {
      const v = annualHi - (annualHi - annualLo) * i / gridLines;
      const gy = pad.top + ph * i / gridLines;
      svg += '<text x="' + (W - pad.right + 8) + '" y="' + (gy + 4) + '" text-anchor="start">$' + Math.round(v) + '</text>';
    }
    svg += '<text x="' + (W - pad.right + 8) + '" y="' + (pad.top - 10) + '" text-anchor="start" font-size="10" font-weight="600" fill="#24292f">年化</text>';
    svg += '</g>';

    // X-axis
    svg += '<g font-size="11" fill="' + 'var(--gh-muted)' + '">';
    svg += '<line x1="' + pad.left + '" y1="' + (pad.top + ph) + '" x2="' + (W - pad.right) + '" y2="' + (pad.top + ph) + '" stroke="#d0d7de"/>';
    const xTicks = 8;
    for (let i = 0; i <= xTicks; i++) {
      const dt = new Date(minDate.getTime() + tRange * i / xTicks);
      const tx = pad.left + pw * i / xTicks;
      const m = dt.getMonth() + 1;
      const y = dt.getFullYear();
      svg += '<text x="' + tx + '" y="' + (H - 12) + '" text-anchor="middle">' + y + "/" + (m < 10 ? "0" : "") + m + '</text>';
    }
    svg += '</g>';

    // "Now" line
    const now = new Date();
    if (now >= minDate && now <= maxDate) {
      const nx = x(now);
      svg += '<line x1="' + nx + '" y1="' + pad.top + '" x2="' + nx + '" y2="' + (pad.top + ph) + '" stroke="var(--gh-blue)" stroke-width="2" stroke-dasharray="8,6" opacity="0.5"/>';
      svg += '<text x="' + nx + '" y="' + (pad.top - 4) + '" text-anchor="middle" font-size="10" fill="var(--gh-blue)" font-weight="600">Now</text>';
    }

    // Model lines
    const visibleModels = data.models.filter(m =>
      m.hasPriceData && m.priceHistory.length > 0 && visible[m.slug]
    );

    visibleModels.forEach(m => {
      const cIdx = modelColors[m.slug];
      const c = COLORS[cIdx];
      const hist = m.priceHistory;

      // Price line (solid)
      svg += '<path d="' + polyline(hist, yPrice) + '" fill="none" stroke="' + c + '" stroke-width="2.2" vector-effect="non-scaling-stroke" opacity="0.9"/>';

      // Annualized line (dashed)
      svg += '<path d="' + polylineAnnual(hist) + '" fill="none" stroke="' + c + '" stroke-width="2" stroke-dasharray="6,4" vector-effect="non-scaling-stroke" opacity="0.7"/>';

      // Dots for price
      hist.forEach(h => {
        const cx = x(new Date(h.date));
        const cy = yPrice(h.price);
        svg += '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="2.5" fill="' + c + '"/>';
      });

      // Dots for annualized (smaller)
      hist.forEach(h => {
        const cx = x(new Date(h.date));
        const cy = yAnnual(h.annualizedPrice);
        svg += '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="1.8" fill="' + c + '" opacity="0.55"/>';
      });
    });

    // EOL markers for visible models
    visibleModels.forEach(m => {
      const cIdx = modelColors[m.slug];
      const c = COLORS[cIdx];
      const eolDate = new Date(m.eol);
      if (eolDate >= minDate && eolDate <= maxDate) {
        const ex = x(eolDate);
        svg += '<line x1="' + ex + '" y1="' + pad.top + '" x2="' + ex + '" y2="' + (pad.top + ph) + '" stroke="' + c + '" stroke-width="1" stroke-dasharray="2,4" opacity="0.35"/>';
        svg += '<text x="' + ex + '" y="' + (pad.top + ph + 16) + '" text-anchor="middle" font-size="9" fill="' + c + '" opacity="0.8">EOL</text>';
      }
    });

    svg += '</svg>';
    CHART_WRAP.innerHTML = svg;
  }

  init();
})();
</script>
</body>
</html>

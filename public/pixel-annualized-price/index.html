<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Annualized Price Timeline</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&display=swap");

    :root {
      --gh-bg: #f6f8fa;
      --gh-surface: #ffffff;
      --gh-border: #d0d7de;
      --gh-text: #24292f;
      --gh-muted: #57606a;
      --gh-blue: #0969da;
      --gh-blue-hover: #0860ca;
      --gh-green: #2da44e;
      --gh-orange: #bf8700;
      --gh-red: #cf222e;
      --gh-shadow: 0 10px 30px rgba(31, 35, 40, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", "Noto Sans SC", sans-serif;
      color: var(--gh-text);
      background:
        radial-gradient(circle at 0% 0%, rgba(9, 105, 218, 0.08) 0%, rgba(9, 105, 218, 0) 45%),
        radial-gradient(circle at 100% 100%, rgba(45, 164, 78, 0.08) 0%, rgba(45, 164, 78, 0) 40%),
        var(--gh-bg);
      display: grid;
      place-items: start center;
      padding: 24px;
    }

    .page {
      width: min(1200px, 100%);
      background: var(--gh-surface);
      border: 1px solid var(--gh-border);
      border-radius: 14px;
      box-shadow: var(--gh-shadow);
      overflow: hidden;
    }

    .topbar {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--gh-border);
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    }

    .topbar-dots { display: flex; gap: 8px; }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      border: 1px solid rgba(31, 35, 40, 0.2);
      background: #f0f3f6;
    }

    .topbar-updated { font-size: 12px; color: var(--gh-muted); }

    .content { padding: 24px 28px; }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }

    .legend {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: var(--gh-muted);
      align-items: center;
    }

    .legend-item { display: flex; align-items: center; gap: 6px; }

    .legend-swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
    }

    .legend-swatch.eol-support { background: var(--gh-green); }
    .legend-swatch.eol-near   { background: var(--gh-orange); }
    .legend-swatch.eol-past   { background: #cf222e33; border: 1px solid var(--gh-red); }
    .legend-swatch.eol-no-price { background: #f0f3f6; border: 1px solid var(--gh-border); }

    /* ---- Timeline ---- */

    .timeline-wrap {
      overflow-x: auto;
      overflow-y: visible;
      -webkit-overflow-scrolling: touch;
    }

    .timeline {
      --row-h: 44px;
      display: grid;
      grid-template-columns: 200px 1fr;
      min-width: 700px;
    }

    .tl-labels,
    .tl-bars { display: flex; flex-direction: column; }

    .tl-label {
      height: var(--row-h);
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 600;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: background 120ms;
    }

    .tl-label:hover { background: #f6f8fa; }

    .tl-bar-row {
      height: var(--row-h);
      display: flex;
      align-items: center;
      position: relative;
      border-bottom: 1px solid #f0f0f0;
    }

    .tl-bar-row:nth-child(even) { background: #fafbfc; }

    .tl-bar {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 22px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      transition: filter 120ms, box-shadow 120ms;
    }

    .tl-bar:hover {
      filter: brightness(0.92);
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .tl-bar.eol-support { background: var(--gh-green); }
    .tl-bar.eol-near   { background: var(--gh-orange); }
    .tl-bar.eol-past   { background: #eaeef2; color: var(--gh-muted); border: 1px dashed var(--gh-border); }
    .tl-bar.eol-no-price { background: #f0f3f6; color: var(--gh-muted); border: 1px solid var(--gh-border); }

    .tl-now-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--gh-blue);
      opacity: 0.35;
      z-index: 2;
      pointer-events: none;
    }

    /* ---- Detail Panel ---- */

    .detail-panel {
      display: none;
      margin-top: 24px;
      border-top: 1px solid var(--gh-border);
      padding-top: 20px;
    }

    .detail-panel.active { display: block; }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .detail-close {
      background: none;
      border: 1px solid var(--gh-border);
      border-radius: 6px;
      padding: 4px 12px;
      cursor: pointer;
      font-size: 13px;
      color: var(--gh-muted);
      font-family: inherit;
    }

    .detail-close:hover { background: #f6f8fa; }

    .detail-metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .metric {
      background: #f6f8fa;
      border: 1px solid var(--gh-border);
      border-radius: 8px;
      padding: 12px 14px;
    }

    .metric-label {
      font-size: 11px;
      color: var(--gh-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 18px;
      font-weight: 700;
    }

    .metric-value.small { font-size: 14px; }

    .chart-wrap { position: relative; }

    .chart-wrap svg { width: 100%; height: 260px; }

    .chart-axis text {
      font-family: inherit;
      font-size: 11px;
      fill: var(--gh-muted);
    }

    .chart-axis line,
    .chart-axis path { stroke: var(--gh-border); }

    .no-data {
      text-align: center;
      padding: 32px;
      color: var(--gh-muted);
    }

    @media (max-width: 640px) {
      .content { padding: 18px 12px; }
      .timeline { --row-h: 38px; }
    }
  </style>
</head>
<body>
<main class="page">
  <header class="topbar" aria-hidden="true">
    <div class="topbar-dots">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
    <span class="topbar-updated" id="updated"></span>
  </header>

  <section class="content">
    <div class="header-row">
      <h1>Pixel 年度化价格时间线</h1>
      <div class="legend">
        <span class="legend-item"><span class="legend-swatch eol-support"></span> 支持中</span>
        <span class="legend-item"><span class="legend-swatch eol-near"></span> 临近 EOL</span>
        <span class="legend-item"><span class="legend-swatch eol-past"></span> 已 EOL</span>
        <span class="legend-item"><span class="legend-swatch eol-no-price"></span> 无价格数据</span>
      </div>
    </div>
    <p style="margin:4px 0 20px;color:var(--gh-muted);font-size:13px;">
      年化价格 = 当前价格 &times; 365.25 &div; 距 EOL 剩余天数。点击型号查看价格走势。
    </p>

    <div class="timeline-wrap">
      <div class="timeline" id="timeline"></div>
    </div>

    <div class="detail-panel" id="detailPanel">
      <div class="detail-header">
        <h2 id="detailTitle" style="margin:0;font-size:18px;"></h2>
        <button class="detail-close" onclick="closeDetail()">关闭</button>
      </div>
      <div class="detail-metrics" id="detailMetrics"></div>
      <div class="chart-wrap" id="chartWrap"></div>
    </div>
  </section>
</main>

<script>
(function() {
  const TIMELINE = document.getElementById("timeline");
  const DETAIL_PANEL = document.getElementById("detailPanel");
  const DETAIL_TITLE = document.getElementById("detailTitle");
  const DETAIL_METRICS = document.getElementById("detailMetrics");
  const CHART_WRAP = document.getElementById("chartWrap");
  const UPDATED_EL = document.getElementById("updated");

  let data = null;
  let activeModel = null;

  async function init() {
    try {
      const resp = await fetch("data.json");
      data = await resp.json();
      UPDATED_EL.textContent = "更新: " + data.updated.slice(0, 10);
      renderTimeline(data.models);
    } catch (e) {
      TIMELINE.innerHTML = '<div class="no-data">加载数据失败: ' + e.message + "</div>";
    }
  }

  function eolStatus(model) {
    if (!model.eol) return "past";
    const today = new Date();
    const eol = new Date(model.eol);
    const months = (eol - today) / (1000 * 60 * 60 * 24 * 30);
    if (eol < today) return "past";
    if (months < 12) return "near";
    return "support";
  }

  function renderTimeline(models) {
    const today = new Date();
    const allDates = models.flatMap(m => [
      new Date(m.releaseDate),
      new Date(m.eol)
    ]);
    const minDate = new Date(Math.min(...allDates));
    const maxDate = new Date(Math.max(...allDates, today));
    const totalMs = maxDate - minDate;

    function pct(dstr) {
      return ((new Date(dstr) - minDate) / totalMs * 100).toFixed(4);
    }

    const nowPct = ((today - minDate) / totalMs * 100).toFixed(4);

    let html = '<div class="tl-labels">';
    let barHtml = '<div class="tl-bars">';

    for (let i = 0; i < models.length; i++) {
      const m = models[i];
      const status = eolStatus(m);
      const leftPct = pct(m.releaseDate);
      const widthPct = Math.max(1, parseFloat(pct(m.eol)) - parseFloat(leftPct));
      const annualLabel = m.hasPriceData
        ? "$" + m.crntAnnualizedPrice + "/yr"
        : "无价格";

      html += '<div class="tl-label" data-idx="' + i + '">' + m.label + "</div>";

      barHtml += '<div class="tl-bar-row">';
      barHtml +=
        '<div class="tl-bar eol-' + status +
        (m.hasPriceData ? "" : " eol-no-price") +
        '" style="left:' + leftPct + "%;width:" + widthPct +
        '%;" data-idx="' + i + '">' + annualLabel + "</div>";
      barHtml += "</div>";
    }

    html += "</div>" + barHtml + "</div>";

    TIMELINE.innerHTML = html;

    // "now" vertical line on last bar row
    const lastRow = TIMELINE.querySelector(".tl-bars .tl-bar-row:last-child");
    if (lastRow) {
      const line = document.createElement("div");
      line.className = "tl-now-line";
      line.style.left = nowPct + "%";
      lastRow.appendChild(line);
    }

    // Click handlers
    TIMELINE.querySelectorAll(".tl-bar, .tl-label").forEach(el => {
      el.addEventListener("click", function() {
        const idx = parseInt(this.dataset.idx);
        showDetail(models[idx]);
      });
    });
  }

  function showDetail(model) {
    activeModel = model;
    DETAIL_TITLE.textContent = model.label;
    DETAIL_PANEL.classList.add("active");

    const days = model.totalDays || 1;
    const remaining = Math.max(0, model.daysRemaining || 0);

    let metricsHtml = "";
    if (model.hasPriceData) {
      metricsHtml += metric("上市价", "$" + model.launchPrice);
      metricsHtml += metric("上市年化", "$" + model.launchAnnualizedPrice + "/yr");
      metricsHtml += metric("当前价", "$" + model.crntPrice);
      metricsHtml += metric("当前年化", "$" + model.crntAnnualizedPrice + "/yr");
    }
    metricsHtml += metric("发布时间", model.releaseDate);
    metricsHtml += metric("EOL", model.eol);
    metricsHtml += metric("总寿命", fmtDays(days));
    metricsHtml += metric("剩余", remaining > 0 ? fmtDays(remaining) : "已 EOL");

    DETAIL_METRICS.innerHTML = metricsHtml;
    DETAIL_PANEL.scrollIntoView({ behavior: "smooth", block: "nearest" });

    if (model.priceHistory && model.priceHistory.length > 1) {
      renderChart(model);
    } else {
      CHART_WRAP.innerHTML = '<div class="no-data">暂无历史价格数据</div>';
    }
  }

  function metric(label, value) {
    return '<div class="metric">' +
      '<div class="metric-label">' + label + '</div>' +
      '<div class="metric-value">' + value + '</div>' +
      '</div>';
  }

  function fmtDays(d) {
    const y = Math.floor(d / 365);
    const m = Math.floor((d % 365) / 30);
    const parts = [];
    if (y > 0) parts.push(y + "年");
    if (m > 0) parts.push(m + "月");
    return parts.join(" ") || d + "天";
  }

  function closeDetail() {
    DETAIL_PANEL.classList.remove("active");
    activeModel = null;
  }

  function renderChart(model) {
    const hist = model.priceHistory;
    const dates = hist.map(h => new Date(h.date));
    const minPrice = Math.min(...hist.map(h => h.price)) * 0.9;
    const maxPrice = Math.max(...hist.map(h => h.price)) * 1.1;
    const minAnnual = Math.min(...hist.map(h => h.annualizedPrice)) * 0.9;
    const maxAnnual = Math.max(...hist.map(h => h.annualizedPrice)) * 1.1;
    const minDate = dates[0];
    const maxDate = dates[dates.length - 1];
    const tRange = maxDate - minDate || 1;

    const W = 800;
    const H = 260;
    const pad = { top: 20, right: 60, bottom: 40, left: 60 };
    const pw = W - pad.left - pad.right;
    const ph = H - pad.top - pad.bottom;

    function x(d) { return pad.left + (d - minDate) / tRange * pw; }
    function y(v, lo, hi) { return pad.top + ph - (v - lo) / (hi - lo) * ph; }

    function polyline(series, lo, hi) {
      let d = "";
      for (let i = 0; i < series.length; i++) {
        const cx = x(dates[i]);
        const cy = y(series[i], lo, hi);
        d += (i === 0 ? "M" : "L") + cx.toFixed(1) + "," + cy.toFixed(1);
      }
      return d;
    }

    let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '">';

    // Grid
    for (let i = 0; i <= 4; i++) {
      const gy = pad.top + ph * i / 4;
      svg += '<line x1="' + pad.left + '" y1="' + gy + '" x2="' + (W - pad.right) + '" y2="' + gy + '" stroke="#eaeef2" stroke-dasharray="4,4"/>';
    }

    // Y axis labels (price on left)
    svg += '<g class="chart-axis">';
    for (let i = 0; i <= 4; i++) {
      const v = minPrice + (maxPrice - minPrice) * (4 - i) / 4;
      const gy = pad.top + ph * i / 4;
      svg += '<text x="' + (pad.left - 6) + '" y="' + (gy + 4) + '" text-anchor="end">$' + Math.round(v) + '</text>';
    }
    svg += '<text x="' + (pad.left - 6) + '" y="' + (pad.top - 6) + '" text-anchor="end" font-size="10" fill="#57606a">价格</text>';

    // Y axis labels (annualized on right)
    for (let i = 0; i <= 4; i++) {
      const v = minAnnual + (maxAnnual - minAnnual) * (4 - i) / 4;
      const gy = pad.top + ph * i / 4;
      svg += '<text x="' + (W - pad.right + 6) + '" y="' + (gy + 4) + '" text-anchor="start">$' + Math.round(v) + '</text>';
    }
    svg += '<text x="' + (W - pad.right + 6) + '" y="' + (pad.top - 6) + '" text-anchor="start" font-size="10" fill="#57606a">年化</text>';
    svg += '</g>';

    // X axis
    svg += '<g class="chart-axis">';
    svg += '<line x1="' + pad.left + '" y1="' + (pad.top + ph) + '" x2="' + (W - pad.right) + '" y2="' + (pad.top + ph) + '" stroke="#d0d7de"/>';
    const xTicks = 5;
    for (let i = 0; i <= xTicks; i++) {
      const dt = new Date(minDate.getTime() + tRange * i / xTicks);
      const tx = pad.left + pw * i / xTicks;
      svg += '<text x="' + tx + '" y="' + (H - 10) + '" text-anchor="middle">' + fmtDate(dt) + '</text>';
    }
    svg += '</g>';

    // Price line
    svg += '<path d="' + polyline(hist.map(h => h.price), minPrice, maxPrice) + '" fill="none" stroke="' + 'var(--gh-blue)' + '" stroke-width="2" vector-effect="non-scaling-stroke"/>';

    // Annualized line
    svg += '<path d="' + polyline(hist.map(h => h.annualizedPrice), minAnnual, maxAnnual) + '" fill="none" stroke="' + 'var(--gh-green)' + '" stroke-width="2" stroke-dasharray="6,3" vector-effect="non-scaling-stroke"/>';

    // Dots
    for (let i = 0; i < hist.length; i++) {
      const cx = x(dates[i]);
      const cyPrice = y(hist[i].price, minPrice, maxPrice);
      const cyAnnual = y(hist[i].annualizedPrice, minAnnual, maxAnnual);
      svg += '<circle cx="' + cx.toFixed(1) + '" cy="' + cyPrice.toFixed(1) + '" r="3" fill="var(--gh-blue)"/>';
      svg += '<circle cx="' + cx.toFixed(1) + '" cy="' + cyAnnual.toFixed(1) + '" r="3" fill="var(--gh-green)"/>';
    }

    svg += '</svg>';

    // Legend
    svg += '<div style="display:flex;justify-content:center;gap:20px;margin-top:8px;font-size:12px;color:var(--gh-muted)">';
    svg += '<span style="display:flex;align-items:center;gap:4px"><span style="display:inline-block;width:16px;height:2px;background:var(--gh-blue)"></span> 价格</span>';
    svg += '<span style="display:flex;align-items:center;gap:4px"><span style="display:inline-block;width:16px;height:2px;background:var(--gh-green);border-top:2px dashed var(--gh-green)"></span> 年度化价格</span>';
    svg += '</div>';

    CHART_WRAP.innerHTML = svg;
  }

  function fmtDate(d) {
    const m = d.getMonth() + 1;
    const y = d.getFullYear();
    return y + "/" + (m < 10 ? "0" : "") + m;
  }

  init();
})();
</script>
</body>
</html>
